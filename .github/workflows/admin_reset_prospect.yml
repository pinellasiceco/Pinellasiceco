name: Admin — Reset prospect 7847841 + Churned diagnostic

# ONE-TIME USE. Delete this workflow and admin_reset_prospect.py after the run completes.
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stripe-checkout-edge-function-BiUpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run diagnostic + reset
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID:     ${{ secrets.SUPABASE_USER_ID }}
        run: python admin_reset_prospect.py
