name: newfood gating test (throwaway)

# THROWAWAY read-only diagnostic. Scoped to the feature branch ONLY so it
# never touches main and never triggers the production rebuild workflow.
# Delete after the single run completes.
on:
  push:
    branches: [claude/stripe-checkout-edge-function-BiUpp]
    paths: ['.github/workflows/newfood_gating_test.yml']

permissions:
  contents: read

jobs:
  gating:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pandas openpyxl

      - name: Run newfood gating analysis
        run: |
          python3 - <<'PY'
          import csv, io, re, sys
          from datetime import date, datetime
          import requests

          NEWFOOD = 'https://www2.myfloridalicense.com/sto/file_download/extracts/newfood.csv'
          INSP    = 'https://www2.myfloridalicense.com/sto/file_download/extracts/3fdinspi.csv'
          INSP_PRIOR = 'https://www2.myfloridalicense.com/hr/inspections/fdinspi_2425.xlsx'

          def fetch(url):
              r = requests.get(url, timeout=180)
              r.raise_for_status()
              return r.content

          def norm_lic(s):
              return re.sub(r'[^0-9]', '', str(s or ''))

          def parse_date(s):
              s = str(s or '').strip()
              if not s or s.lower() in ('nan','nat','none'):
                  return None
              s = s.split(' ')[0]
              for fmt in ('%m/%d/%Y','%Y-%m-%d','%m/%d/%y','%m-%d-%Y','%Y/%m/%d'):
                  try:
                      return datetime.strptime(s, fmt).date()
                  except ValueError:
                      continue
              return None

          print('================ newfood.csv ================', flush=True)
          raw = fetch(NEWFOOD)
          text = raw.decode('latin-1', errors='replace')
          rdr = list(csv.reader(io.StringIO(text)))
          header = rdr[0]
          rows = rdr[1:]
          print(f'TOTAL DATA ROWS: {len(rows)}')
          print(f'COLUMN COUNT: {len(header)}')
          print('FULL HEADER (verbatim, one per line):')
          for i,h in enumerate(header):
              print(f'  [{i}] {h!r}')
          print('FIRST 3 RAW ROWS:')
          for r in rows[:3]:
              print('  ', r)

          # column detection by name
          def find_col(*subs):
              for i,h in enumerate(header):
                  hl = h.lower()
                  if all(x in hl for x in subs):
                      return i
              return None

          ci_county_code = find_col('county','code')
          ci_county_num  = find_col('county','number')
          ci_county_name = find_col('county','name') or find_col('county')
          ci_lic   = find_col('license','number')
          ci_apptype = find_col('application','type')
          ci_appdate = find_col('application','approval')
          # location address candidates
          ci_loc_addr = (find_col('location','address') or find_col('physical','address'))
          ci_mail_addr = find_col('mailing','address')

          print('\nDETECTED COLUMN INDICES:')
          print(f'  county_code={ci_county_code} county_number={ci_county_num} county_name={ci_county_name}')
          print(f'  license_number={ci_lic} application_type={ci_apptype} application_approval_date={ci_appdate}')
          print(f'  location_address={ci_loc_addr} mailing_address={ci_mail_addr}')

          def cell(row, i):
              return row[i] if (i is not None and i < len(row)) else ''

          # Pinellas filter: county code/number == 62 OR county name contains PINELLAS
          def is_pinellas(row):
              for ci in (ci_county_code, ci_county_num):
                  if ci is not None and norm_lic(cell(row,ci)) == '62':
                      return True
              if ci_county_name is not None and 'PINELLAS' in cell(row,ci_county_name).upper():
                  return True
              return False

          pin = [r for r in rows if is_pinellas(r)]
          print(f'\n================ PINELLAS FILTER ================')
          print(f'PINELLAS ROWS (county 62): {len(pin)}')

          # distinct application type values
          if ci_apptype is not None:
              from collections import Counter
              c = Counter(cell(r,ci_apptype).strip() for r in pin)
              print('DISTINCT Application Type values (value : count) in Pinellas:')
              for k,v in c.most_common():
                  print(f'  {k!r} : {v}')
          else:
              print('Application Type column NOT FOUND')

          # location address presence + example
          print('\n================ ADDRESS FIELD ================')
          if ci_loc_addr is not None:
              ex = next((cell(r,ci_loc_addr) for r in pin if cell(r,ci_loc_addr).strip()), '')
              filled = sum(1 for r in pin if cell(r,ci_loc_addr).strip())
              print(f'Location address column = [{ci_loc_addr}] {header[ci_loc_addr]!r}')
              print(f'  populated in {filled}/{len(pin)} Pinellas rows; example: {ex!r}')
          else:
              print('No explicit Location/Physical Address column detected. Address-like columns:')
              for i,h in enumerate(header):
                  if 'address' in h.lower() or 'city' in h.lower() or 'zip' in h.lower():
                      ex = next((cell(r,i) for r in pin if cell(r,i).strip()), '')
                      print(f'  [{i}] {h!r} example={ex!r}')

          # ---------- inspection data: license -> first inspection date ----------
          print('\n================ INSPECTION DATA ================')
          first_insp = {}
          def add_insp(lic_raw, dt):
              k = norm_lic(lic_raw)
              if not k or dt is None:
                  return
              if k not in first_insp or dt < first_insp[k]:
                  first_insp[k] = dt

          # current FY CSV (positional: license=col4, inspection date=col14)
          try:
              itxt = fetch(INSP).decode('latin-1', errors='replace')
              irows = csv.reader(io.StringIO(itxt))
              n=0
              for row in irows:
                  if len(row) < 15:
                      continue
                  add_insp(row[4], parse_date(row[14]))
                  n+=1
              print(f'Current-FY 3fdinspi.csv rows parsed: {n}; unique licenses: {len(first_insp)}')
          except Exception as e:
              print(f'current FY inspection load failed: {e}')

          # prior FY xlsx (best effort, same positional layout)
          try:
              import pandas as pd
              xls = pd.read_excel(io.BytesIO(fetch(INSP_PRIOR)), header=None, dtype=str)
              cnt=0
              for _,row in xls.iterrows():
                  if row.shape[0] < 15:
                      continue
                  add_insp(row.iloc[4], parse_date(row.iloc[14]))
                  cnt+=1
              print(f'Prior-FY fdinspi_2425.xlsx rows parsed: {cnt}; unique licenses now: {len(first_insp)}')
          except Exception as e:
              print(f'prior FY xlsx load skipped: {e}')

          # ---------- CORE TEST: 5 matched businesses ----------
          print('\n================ CORE GAP TEST (5 matches) ================')
          if ci_lic is None or ci_appdate is None:
              print('Cannot run gap test: license or approval-date column missing')
              sys.exit(0)
          biz_idx = (find_col('business','name') or find_col('dba') or find_col('name'))
          matches = []
          for r in pin:
              k = norm_lic(cell(r,ci_lic))
              ad = parse_date(cell(r,ci_appdate))
              if k and ad and k in first_insp:
                  matches.append((r,k,ad,first_insp[k]))
              if len(matches) >= 5:
                  break

          if not matches:
              print('No Pinellas businesses matched between newfood.csv and inspection data by License Number.')
          gaps=[]
          for r,k,ad,fi in matches:
              gap = (fi - ad).days   # positive => inspection AFTER approval (approval first = lead time)
              gaps.append(gap)
              nm = cell(r, biz_idx) if biz_idx is not None else ''
              at = cell(r, ci_apptype) if ci_apptype is not None else ''
              print(f'  Lic {k} | {nm[:38]!r} | AppType={at!r}')
              print(f'      Application Approval Date: {ad}')
              print(f'      First inspection on record: {fi}')
              print(f'      GAP (first_insp - approval) = {gap} days '
                    f'({"approval first / lead time" if gap>0 else "inspection first / no lead" if gap<0 else "same day"})')

          if gaps:
              avg = sum(gaps)/len(gaps)
              print(f'\nAVERAGE GAP across {len(gaps)} businesses: {avg:.1f} days')
              print(f'MEDIAN-ish (sorted): {sorted(gaps)}')
              if avg > 21:
                  print('CONCLUSION: Approval meaningfully PRECEDES first inspection — real lead time exists.')
              elif avg < 0:
                  print('CONCLUSION: First inspection comes BEFORE/at approval — NO outreach advantage.')
              else:
                  print('CONCLUSION: Approval ~ first inspection (within ~3 weeks) — marginal advantage at best.')
          print('\n================ END ================')
          PY
