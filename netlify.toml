# pinellasiceco.com — Astro site lives in site/; the rest of this repo is
# internal tooling deployed separately to GitHub Pages.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["ops/prompts/*.md"]

# ---------------------------------------------------------------------------
# 301 map — per site/ops/preservation-ledger.md (classification built from the
# operator's GSC export, 2026-07-03, last-3-months). No chains, no 302s.
# NOT redirected (200 at original paths): /,
# /ice-machine-cleaning-clearwater-fl-pinellas-ice-co, /terms,
# /ice-machine-data. Entries marked PORT-CANDIDATE are interim 301s — the
# ledger recommends porting those pages' content to their original slugs;
# each redirect below simply gets deleted when its page is ported.
# ---------------------------------------------------------------------------

# --- City cleaning pages (PORT-CANDIDATEs; interim → closest intent) ---
