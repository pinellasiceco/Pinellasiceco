  to = "/ice-machine-cleaning/"
  status = 301

# --- Legacy internal-tool link handed out in partner one-pagers ---
[[redirects]]
  from = "/explore"
  to = "/ice-machine-data/"
  status = 301

# HubSpot system/asset paths die with HubSpot; kill 404 noise in one hop.
[[redirects]]
  from = "/hs-fs/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/hubfs/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/_hcms/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/cs/*"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
